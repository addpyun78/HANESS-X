[package]
name = "harness-x-desktop"
version = "0.1.0"
description = "HARNESS-X desktop (Tauri 2)"
edition = "2021"
publish = false

[lib]
name = "harness_x_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
